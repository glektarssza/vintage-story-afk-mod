version: 2
updates:
  - directory: .github/workflows
    package-ecosystem: github-actions
    patterns:
      - '*'
    ignore: []
    target-branch: main
    rebase-strategy: auto
    commit-message:
      include: scope
      prefix: '[Dependabot] '
    labels:
      - Dependency
    schedule:
      interval: weekly
      day: wednesday
      time: '12:00'
      timezone: Canada/Mountain
  - directory: /
    package-ecosystem: nuget
    patterns:
      - '*'
    ignore: []
    target-branch: main
    rebase-strategy: auto
    commit-message:
      include: scope
      prefix: '[Dependabot] '
    labels:
      - Dependency
    versioning-strategy: increase
    schedule:
      interval: weekly
      day: wednesday
      time: '12:00'
      timezone: Canada/Mountain
