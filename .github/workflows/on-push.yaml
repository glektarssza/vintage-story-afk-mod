# yaml-language-server: $schema=https://www.schemastore.org/github-workflow.json
name: On Push
on:
  push:
env:
  GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
jobs:
  build:
    name: Build
    permissions:
      # -- Needed to clone the repository
      contents: read
    strategy:
      matrix:
        build-config:
          - debug
          - release
      fail-fast: true
    uses: ./.github/workflows/build.yaml
    with:
      build-config: ${{matrix.build-config}}
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  test:
    name: Test
    permissions:
      # -- Needed to clone the repository
      contents: read
    strategy:
      matrix:
        build-config:
          - debug
          - release
      fail-fast: true
    uses: ./.github/workflows/test.yaml
    with:
      build-config: ${{matrix.build-config}}
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  lint:
    name: Lint
    permissions:
      # -- Needed to clone the repository
      contents: read
    uses: ./.github/workflows/lint.yaml
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
  spell-check:
    name: Spell Check
    permissions:
      # -- Needed to clone the repository
      contents: read
    uses: ./.github/workflows/spell-check.yaml
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
