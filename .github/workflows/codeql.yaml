# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CodeQL
on:
  push:
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 12 * * 3'
  workflow_call:
    secrets:
      github-token:
        description: |
          The token to use for making authenticated requests to the GitHub API.
        required: true
env:
  GH_TOKEN: ${{secrets.github-token || secrets.GITHUB_TOKEN}}
jobs:
  codeql-analyze:
    name: CodeQL Analyze
    runs-on: ubuntu-latest
    permissions:
      # -- To clone repository
      contents: read
      # -- To write security events
      security-events: write
    steps:
      - id: checkout-repository
        name: Checkout repository
        uses: actions/checkout@v7
        with:
          lfs: true
          token: ${{env.GH_TOKEN}}
      - id: setup-dotnet
        name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: |
            ${{github.workspace}}/AFKMod/packages.lock.json
            ${{github.workspace}}/CakeBuild/packages.lock.json
      - id: download-vintage-story
        name: Download Vintage Story
        run: |
          mkdir -p ${{github.workspace}}/vs_install/
          wget https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_1.22.3.tar.gz -O ${{github.workspace}}/vs_install/vs_client_linux-x64_1.22.3.tar.gz
          tar -C ${{github.workspace}}/vs_install/ -xvzf ${{github.workspace}}/vs_install/vs_client_linux-x64_1.22.3.tar.gz
          cat > user.props <<HEREDOC
          <?xml version="1.0" encoding="UTF-8"?>
          <Project>
              <PropertyGroup>
                  <VintageStoryInstallPath>${{github.workspace}}/vs_install/vintagestory/</VintageStoryInstallPath>
              </PropertyGroup>
          </Project>
          HEREDOC
          rm ${{github.workspace}}/vs_install/vs_client_linux-x64_1.22.3.tar.gz
      - id: restore-dependencies
        name: Restore dependencies
        run: dotnet restore
      - id: initialize-codeql
        name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: csharp
          queries: security-and-quality
          token: ${{env.GH_TOKEN}}
      - id: build
        name: Build
        run: ${{github.workspace}}/build.sh --configuration Debug
      - id: analyze
        name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          token: ${{env.GH_TOKEN}}
