# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Manual Build
on:
  workflow_dispatch:
    inputs:
      build-config:
        description: |
          The configuration to build.

          Valid options are:
           * "debug"
           * "release"
        required: true
        type: choice
        options:
          - debug
          - release
jobs:
  build:
    name: Build
    permissions:
      contents: read
    secrets:
      github-token: ${{secrets.GITHUB_TOKEN}}
    uses: ./.github/workflows/build.yaml
    with:
      build-config: ${{inputs.build-config}}
